<div class="tile">
  <img
    [src]="fullLink()"
    [alt]="userShow()?.show?.name || ''"
  />

  <div class="title">
    {{ userShow()?.show?.name }}
  </div>
<div>
<div class="btn-div">
  @for (action of actions(); track action.label) {
    @if (!action.visible || action.visible(userShow()!)) {
      <button mat-button (click)="action.execute(userShow()!)">
        {{ action.label }}
      </button>
    }
  }
</div>
</div>
