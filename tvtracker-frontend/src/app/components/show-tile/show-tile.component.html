<div class="tile">
  <img
    [src]="fullLink()"
    [alt]="userShow()?.show?.name || ''"
  />

  <div class="title">
    {{ userShow()?.show?.name }}
  </div>

  @if (!userShow()?.userShowId) {
    <button mat-button (click)="addToMyShows()">
      Add to My Shows
    </button>
  } @else {
    <button mat-button (click)="removeFromMyShows()">
      Remove from My Shows
    </button>
  }
</div>
