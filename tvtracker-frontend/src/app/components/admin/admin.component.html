<div>
    <h1>Admin Panel</h1>
    <p>Below are controls used to configure the application if you do not know what you doing Do not click any buttons.</p>
</div>
<div class="container">

<div class="box">Fetch show Data: </div>
<div class="box">
    <button (click)="fetchShowData()" mat-button>Fetch Data</button>
</div>
<div class="box">Delete User Accounts:</div>
<div class="box">
      <div class="users">
    @for (user of users(); track user.id) {

  <button (click)="deleteUser(user)">
    delete {{ user.username }}
  </button>
}
</div>
</div>
