<mat-toolbar color="primary" class="app-header">
  <!-- App Name -->
  <a routerLink="/" class="app-name-link">
    <span class="app-name">TV Tracker</span>
  </a>
  <br>

  <!-- Spacer to push menu and profile button to the right -->
  <span class="toolbar-spacer"></span>

  <!-- Main Menu -->
  <div class="main-menu">
    <button mat-button routerLink="/my-shows">My Shows</button>
    <button mat-button routerLink="/show-index">New Shows</button>

    <!-- Menu with nested links -->
    <button mat-button [matMenuTriggerFor]="networkMenu">By Network</button>
    <mat-menu #networkMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>live_tv</mat-icon>
        <span>Netflix</span>
      </button>
      <button mat-menu-item>
        <mat-icon>live_tv</mat-icon>
        <span>HBO</span>
      </button>
      <button mat-menu-item>
        <mat-icon>live_tv</mat-icon>
        <span>Hulu</span>
      </button>
    </mat-menu>
  </div>

  <!-- Spacer for far right alignment -->
  <span class="toolbar-spacer"></span>

  <!-- User Profile Button -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>person</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>account_circle</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item>
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
