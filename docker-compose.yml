version: '3.8'

services:
  db:
    image: postgres
    container_name: tv-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvtracker
    ports:
      - "5432:5432"
    volumes:
      - tvtracker-data:/var/lib/postgresql/data

volumes:
  tvtracker-data: